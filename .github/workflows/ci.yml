name: ci

# push is limited to main so that a pull request from a branch in this repo
# triggers one run, not two (a push run and a pull_request run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository. Narrowing this from the default token
# scope means a compromised dependency cannot push, tag or comment.
permissions:
  contents: read

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: the cache key and the install step both use it.
  EMSDK_VERSION: 3.1.69

defaults:
  run:
    # Actions' implicit shell is `bash -e`. Naming bash explicitly also turns
    # on pipefail, so a failure in the middle of a pipeline is not swallowed.
    shell: bash

jobs:
  check:
    name: build, analyse and test
    runs-on: ubuntu-latest
    # The fuzz stage runs 300 emulator images; cap the job so a hang cannot
    # sit burning runner minutes.
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libsdl2-dev \
            cppcheck

      # Fail fast here only: none of the stages below can say anything useful
      # if the tree does not compile.
      - name: Build emulator
        id: build
        run: make

      # Each stage below is gated on the build rather than on the stage before
      # it, so one failing stage does not hide the other four. Note the absence
      # of continue-on-error: that would report a failing stage as a green tick
      # and leave only a final gate step red. This way every stage shows its
      # real result and the job fails on its own.
      #
      # !cancelled() rather than always(): always() would ignore cancellation
      # and keep working through all five stages after cancel-in-progress above
      # has superseded the run.
      - name: Static analysis (gcc warnings + -fanalyzer)
        id: analyze
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make analyze

      - name: Static analysis (cppcheck)
        id: cppcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make cppcheck

      - name: Unit tests
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test

      - name: Unit tests under AddressSanitizer and UBSan
        id: test_asan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test-asan

      - name: Fuzz cart images
        id: fuzz
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make fuzz

      # Prebuilt ROMs from a pinned release, so no assembler is needed. Kept a
      # separate step from the run below so a download problem is not reported
      # as a test failure.
      - name: Fetch test ROMs
        id: fetch_roms
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make fetch-test-roms

      # Compares against Test/roms/expected.txt, so this fails on a regression
      # rather than on the suites not being fully passed yet.
      - name: Test ROMs (blargg and mooneye)
        id: test_roms
        if: ${{ !cancelled() && steps.fetch_roms.outcome == 'success' }}
        run: make test-roms

      - name: Upload analysis log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: Build/analyze.log
          if-no-files-found: ignore
          retention-days: 14

      # Reporting only. The job's pass/fail already follows from the stages
      # above, so this never changes the outcome; it collects the stages into
      # one table on the run page so a red build is legible at a glance.
      - name: Summarise
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          CPPCHECK: ${{ steps.cppcheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          TEST_ASAN: ${{ steps.test_asan.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
          FETCH_ROMS: ${{ steps.fetch_roms.outcome }}
          TEST_ROMS: ${{ steps.test_roms.outcome }}
        run: |
          {
            echo "### Stages"
            echo
            echo "| stage | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for stage in BUILD ANALYZE CPPCHECK TEST TEST_ASAN FUZZ \
                       FETCH_ROMS TEST_ROMS; do
            outcome="${!stage:-skipped}"
            case "$outcome" in
              success)  mark=':white_check_mark: pass' ;;
              skipped)  mark=':fast_forward: skipped' ;;
              failure)  mark=':x: fail' ;;
              *)        mark=":grey_question: $outcome" ;;
            esac
            echo "| \`${stage,,}\` | $mark |" >> "$GITHUB_STEP_SUMMARY"
            printf '%-10s %s\n' "$stage" "$outcome"
          done

  # Builds the browser version and publishes it to GitHub Pages. Only on a push
  # to main: a pull request cannot deploy, and only one source of truth for the
  # published page makes sense.
  #
  # Needs the repository's Pages source set to "GitHub Actions" (Settings ->
  # Pages); until that is done this job fails at the deploy step with the build
  # itself having succeeded.
  deploy-web:
    name: build and publish the web version
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Installed from upstream rather than through a third-party action, so the
      # toolchain version is pinned here and there is one less dependency to
      # trust. Cached because the SDK is large and rarely changes.
      - name: Cache Emscripten SDK
        id: emsdk_cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build web version
        run: |
          # shellcheck disable=SC1091
          . ~/emsdk/emsdk_env.sh
          emcc --version | head -1
          make web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: Build/web

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
